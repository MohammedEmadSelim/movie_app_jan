name: movies
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.1
  carousel_slider: ^5.1.2
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# ---------------- ICON ----------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/popcorn_1.png
  min_sdk_android: 21

# ---------------- SPLASH ----------------
flutter_native_splash:
  color: "#242A32"
  image: assets/splash.png
  fullscreen: true

  android_12:
    color: "#242A32"
    image: assets/splash.png
    icon_background_color: "#242A32"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/screenshots/
    - assets/icons/
    - assets/popcorn_1.png
    - assets/splash.png

  fonts:
    - family: MyFlutterApp
      fonts:
        - asset: assets/MyFlutterApp.ttf
